server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Долгий кэш для иммутабельных ассетов с хэшем в имени.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API-запросы проксируем на backend-сервис.
    # Переменная + resolver Docker — nginx стартует даже если backend ещё не поднят,
    # и резолвит его по имени в момент запроса (а не падает при загрузке конфига).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_api http://api:8080;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-fallback: всё остальное отдаём через index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
