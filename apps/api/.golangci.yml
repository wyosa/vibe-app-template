version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - sloglint
    # Безопасность и работа с сетью/БД.
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
